name: Deploy

# Build no GitHub, deploy por SSH. As imagens são construídas aqui (runner com RAM de
# sobra) e a VM só faz "pull" — ela tem 4 GB e divide o host com um servidor de e-mail,
# então compilar lá é o que a gente quer evitar.
#
# Disparo é só manual (Actions -> Deploy -> Run workflow, ou "gh workflow run deploy.yml"),
# e apenas a partir da main: merge na main não coloca nada no ar sozinho.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "SHA de uma imagem já publicada (para rollback). Vazio = build do commit atual."
        required: false
        default: ""

# Dois deploys simultâneos deixariam a VM num estado indeterminado. Não cancela o que
# está em andamento: um deploy interrompido no meio é pior do que um deploy a mais.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  build:
    name: Build e push das imagens
    # Pulado no rollback: a imagem pedida já existe no registry.
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # workflow_dispatch aceita qualquer branch; a produção só aceita a main.
      - name: Confere a branch de origem
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow só implanta a partir da main (recebido: ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O "npm run build" do Dockerfile roda tsc antes do Vite, e o publish do .NET
      # compila a solução inteira: um erro de tipo ou de compilação falha aqui e o job
      # de deploy nem começa. É isto que faz o papel de CI.
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Caritas.WebApi/Dockerfile
          push: true
          tags: |
            ghcr.io/crmetz/caritas-app-backend:latest
            ghcr.io/crmetz/caritas-app-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Vazio de propósito: o bundle chama /api relativo e o nginx faz o proxy.
          build-args: |
            VITE_API_URL=
          tags: |
            ghcr.io/crmetz/caritas-app-frontend:latest
            ghcr.io/crmetz/caritas-app-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy na VM
    needs: [build]
    # "always()" porque no rollback o job de build é pulado — e um job pulado não é falha.
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # workflow_dispatch aceita qualquer branch; a produção só aceita a main.
      - name: Confere a branch de origem
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Este workflow só implanta a partir da main (recebido: ${{ github.ref }})."
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/app/caritas

            # O compose e o nginx.conf também são versionados: a VM precisa ficar no
            # mesmo commit da imagem. O .env não é versionado, então sobrevive ao reset.
            git fetch origin main
            git reset --hard "origin/main"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            APP_PORT="$(grep -E '^APP_PORT=' .env | cut -d= -f2 || echo 8081)"

            # A API aplica as migrations no startup, então o primeiro request pode demorar.
            ok=0
            for _ in $(seq 1 30); do
              if curl -fsS "http://localhost:${APP_PORT}/health" > /dev/null; then
                ok=1
                break
              fi
              sleep 5
            done

            if [ "$ok" != "1" ]; then
              echo "::error::Health check falhou após 150s."
              docker compose -f docker-compose.prod.yml logs --tail 80 backend || true
              if [ -f .last-good-tag ]; then
                echo "Voltando para $(cat .last-good-tag)"
                IMAGE_TAG="$(cat .last-good-tag)" \
                  docker compose -f docker-compose.prod.yml up -d
              fi
              exit 1
            fi

            echo "$IMAGE_TAG" > .last-good-tag
            # Sem "-a": esta VM hospeda outros projetos cujas imagens não podemos apagar.
            docker image prune -f

            echo "Deploy concluído: $IMAGE_TAG"
