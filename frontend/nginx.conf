server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: proxy para o container do backend na rede interna do Docker.
    # Mesma origem do frontend, portanto sem CORS e sem preflight.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check da API (fora do prefixo /api, precisa de regra própria)
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Assets com hash no nome (gerados pelo Vite) podem ter cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache: é ele que aponta para os assets novos após um deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: qualquer rota desconhecida cai no index.html para o react-router resolver
    # (sem isso, F5 em /familias retorna 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
